<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Magic Square 3x3 (Moscow Puzzles #331 — Indian origin) -->
  <defs>
    <linearGradient id="cellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8E1"/>
      <stop offset="100%" style="stop-color:#FFE082"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6F00"/>
      <stop offset="100%" style="stop-color:#E65100"/>
    </linearGradient>
  </defs>
  <!-- Background — warm Indian theme -->
  <rect width="600" height="400" fill="#3E2723" rx="12"/>
  <!-- Decorative border pattern -->
  <rect x="8" y="8" width="584" height="384" fill="none" stroke="#FF8F00" stroke-width="2" rx="10" stroke-dasharray="8,4"/>
  <rect x="14" y="14" width="572" height="372" fill="none" stroke="#FF8F00" stroke-width="1" rx="8" opacity="0.5"/>
  <text x="300" y="40" text-anchor="middle" font-family="Georgia" font-size="20" fill="#FFD700" font-weight="bold">The Ancient Magic Square</text>
  <text x="300" y="60" text-anchor="middle" font-family="Georgia" font-size="12" fill="#FFCC80" font-style="italic">From ancient India — every row, column, and diagonal sums to 15!</text>
  <!-- 3x3 Grid -->
  <!-- Row 1 -->
  <rect x="175" y="80" width="80" height="80" fill="url(#cellGrad)" stroke="#5D4037" stroke-width="2" rx="4"/>
  <text x="215" y="128" text-anchor="middle" font-family="Georgia" font-size="28" fill="#BF360C" font-weight="bold">?</text>
  <rect x="260" y="80" width="80" height="80" fill="url(#cellGrad)" stroke="#5D4037" stroke-width="2" rx="4"/>
  <text x="300" y="128" text-anchor="middle" font-family="Georgia" font-size="28" fill="#BF360C" font-weight="bold">?</text>
  <rect x="345" y="80" width="80" height="80" fill="url(#cellGrad)" stroke="#5D4037" stroke-width="2" rx="4"/>
  <text x="385" y="128" text-anchor="middle" font-family="Georgia" font-size="28" fill="#BF360C" font-weight="bold">?</text>
  <!-- Row 2 -->
  <rect x="175" y="165" width="80" height="80" fill="url(#cellGrad)" stroke="#5D4037" stroke-width="2" rx="4"/>
  <text x="215" y="213" text-anchor="middle" font-family="Georgia" font-size="28" fill="#BF360C" font-weight="bold">?</text>
  <rect x="260" y="165" width="80" height="80" fill="url(#cellGrad)" stroke="#5D4037" stroke-width="2" rx="4"/>
  <text x="300" y="213" text-anchor="middle" font-family="Georgia" font-size="28" fill="#BF360C" font-weight="bold">?</text>
  <rect x="345" y="165" width="80" height="80" fill="url(#cellGrad)" stroke="#5D4037" stroke-width="2" rx="4"/>
  <text x="385" y="213" text-anchor="middle" font-family="Georgia" font-size="28" fill="#BF360C" font-weight="bold">?</text>
  <!-- Row 3 -->
  <rect x="175" y="250" width="80" height="80" fill="url(#cellGrad)" stroke="#5D4037" stroke-width="2" rx="4"/>
  <text x="215" y="298" text-anchor="middle" font-family="Georgia" font-size="28" fill="#BF360C" font-weight="bold">?</text>
  <rect x="260" y="250" width="80" height="80" fill="url(#cellGrad)" stroke="#5D4037" stroke-width="2" rx="4"/>
  <text x="300" y="298" text-anchor="middle" font-family="Georgia" font-size="28" fill="#BF360C" font-weight="bold">?</text>
  <rect x="345" y="250" width="80" height="80" fill="url(#cellGrad)" stroke="#5D4037" stroke-width="2" rx="4"/>
  <text x="385" y="298" text-anchor="middle" font-family="Georgia" font-size="28" fill="#BF360C" font-weight="bold">?</text>
  <!-- Sum indicators -->
  <text x="460" y="128" font-family="Arial" font-size="14" fill="#4CAF50" font-weight="bold">= 15</text>
  <text x="460" y="213" font-family="Arial" font-size="14" fill="#4CAF50" font-weight="bold">= 15</text>
  <text x="460" y="298" font-family="Arial" font-size="14" fill="#4CAF50" font-weight="bold">= 15</text>
  <text x="215" y="355" text-anchor="middle" font-family="Arial" font-size="14" fill="#4CAF50" font-weight="bold">15</text>
  <text x="300" y="355" text-anchor="middle" font-family="Arial" font-size="14" fill="#4CAF50" font-weight="bold">15</text>
  <text x="385" y="355" text-anchor="middle" font-family="Arial" font-size="14" fill="#4CAF50" font-weight="bold">15</text>
  <!-- Diagonal indicators -->
  <line x1="175" y1="80" x2="425" y2="330" stroke="#FF5722" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="425" y1="80" x2="175" y2="330" stroke="#FF5722" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <!-- Number bank on left -->
  <rect x="30" y="90" width="120" height="240" fill="#4E342E" rx="10" opacity="0.9"/>
  <text x="90" y="118" text-anchor="middle" font-family="Georgia" font-size="13" fill="#FFD700" font-weight="bold">Numbers</text>
  <circle cx="60" cy="145" r="16" fill="url(#headerGrad)"/><text x="60" y="151" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">1</text>
  <circle cx="90" cy="145" r="16" fill="url(#headerGrad)"/><text x="90" y="151" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">2</text>
  <circle cx="120" cy="145" r="16" fill="url(#headerGrad)"/><text x="120" y="151" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">3</text>
  <circle cx="60" cy="185" r="16" fill="url(#headerGrad)"/><text x="60" y="191" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">4</text>
  <circle cx="90" cy="185" r="16" fill="url(#headerGrad)"/><text x="90" y="191" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">5</text>
  <circle cx="120" cy="185" r="16" fill="url(#headerGrad)"/><text x="120" y="191" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">6</text>
  <circle cx="60" cy="225" r="16" fill="url(#headerGrad)"/><text x="60" y="231" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">7</text>
  <circle cx="90" cy="225" r="16" fill="url(#headerGrad)"/><text x="90" y="231" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">8</text>
  <circle cx="120" cy="225" r="16" fill="url(#headerGrad)"/><text x="120" y="231" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">9</text>
  <!-- Fun fact -->
  <rect x="30" y="268" width="120" height="50" fill="#1B5E20" rx="6" opacity="0.7"/>
  <text x="90" y="286" text-anchor="middle" font-family="Arial" font-size="9" fill="#C8E6C9">Fun fact: This was</text>
  <text x="90" y="298" text-anchor="middle" font-family="Arial" font-size="9" fill="#C8E6C9">discovered in India</text>
  <text x="90" y="310" text-anchor="middle" font-family="Arial" font-size="9" fill="#C8E6C9">over 2000 years ago!</text>
  <!-- Bottom -->
  <rect x="160" y="365" width="280" height="28" fill="#E65100" rx="6" opacity="0.8"/>
  <text x="300" y="384" text-anchor="middle" font-family="Arial" font-size="12" fill="white">Drag numbers into the grid!</text>
</svg>
