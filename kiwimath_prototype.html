<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Kiwimath — Prototype</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap');
:root{
  --bg:#FAFAF7; --card:#FFFFFF; --ink:#191D26; --muted:#7C8597; --faint:#A7AEBC; --line:#ECEAE3;
  --orange:#FF6D00; --orange-d:#E65100; --orange-l:#FFF2E6;
  --nt:#3D7DF6; --alg:#8B5CF6; --geo:#0FB17E; --com:#F59E0B;
  --nt-l:#EAF1FE; --alg-l:#F2ECFE; --geo-l:#E5F7F0; --com-l:#FEF4E0;
  --green:#0FB17E; --green-l:#E5F7F0; --blue:#3D7DF6; --blue-l:#EAF1FE;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:radial-gradient(1100px 700px at 50% -8%, #FFE7CE 0%, #F3ECFB 48%, #E7ECFF 100%);
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:18px;color:var(--ink)}
h1,h2,h3,.display{font-family:'Baloo 2','Nunito',sans-serif;margin:0;letter-spacing:.2px}
.phone{width:393px;max-width:96vw;height:min(852px,94vh);background:var(--bg);border-radius:46px;
  box-shadow:0 30px 80px rgba(60,30,10,.26),0 0 0 11px #14161d,0 0 0 13px #2a2d38;
  overflow:hidden;position:relative;display:flex;flex-direction:column}
.statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 30px;
  font-size:14px;font-weight:800;flex:0 0 auto}
.statusbar .r{display:flex;gap:6px;align-items:center;color:var(--ink)}
.notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:116px;height:28px;background:#14161d;border-radius:18px;z-index:5}
.screen{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:2px 0 98px}
.screen::-webkit-scrollbar{display:none}
.appbar{padding:10px 20px 2px;display:flex;align-items:center;gap:12px}
.appbar .back{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.appbar h1{font-size:26px;font-weight:800}
.appbar .sub{color:var(--muted);font-weight:700;font-size:13px;margin-top:1px}
.wrap{padding:6px 20px}
.eyebrow{font-size:12px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:1px;margin:20px 4px 11px}
.row{display:flex;align-items:center;gap:13px}
.grow{flex:1 1 auto;min-width:0}
.title{font-weight:800;font-size:16px;line-height:1.15}
.meta{color:var(--muted);font-weight:700;font-size:13px;margin-top:3px}
.muted{color:var(--muted)} .faint{color:var(--faint)}
svg{display:block}
/* journey (levels) */
.journey{position:relative;padding-left:6px}
.lvl{display:flex;gap:14px;align-items:stretch;cursor:pointer;margin-bottom:10px}
.lvl .railwrap{display:flex;flex-direction:column;align-items:center;width:48px;flex:0 0 auto}
.node{width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  font-family:'Baloo 2';font-weight:800;font-size:18px;color:#fff;background:linear-gradient(135deg,#FF9A3D,#FF6D00);position:relative;z-index:2}
.node.done{background:linear-gradient(135deg,#21C796,#0FB17E)}
.node.locked{background:#E4E6EC;color:#AEB4C1}
.rail{width:3px;flex:1;background:var(--line);margin:3px 0}
.lvl .body{flex:1;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 15px;display:flex;align-items:center;gap:12px}
.lvl.locked .body{background:#F7F7F4}
.lvl:active .body{transform:scale(.99)}
.chip{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:11.5px;padding:4px 9px;border-radius:999px}
.chip.go{background:var(--orange-l);color:var(--orange-d)} .chip.done{background:var(--green-l);color:var(--green)} .chip.soon{background:#EEF0F4;color:var(--faint)}
/* hero */
.hero{margin:10px 20px 4px;border-radius:22px;padding:18px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,#FF8A2B,#FF6D00 60%,#E65100)}
.hero h2{font-size:20px;font-weight:800} .hero p{margin:6px 0 0;font-weight:700;opacity:.95;font-size:13px}
.hero .cta{margin-top:13px;display:inline-flex;align-items:center;gap:7px;background:#fff;color:var(--orange-d);font-weight:800;font-size:14px;padding:10px 16px;border-radius:13px;border:none;cursor:pointer}
.hero .mk{position:absolute;right:-14px;bottom:-24px;opacity:.16}
/* topic grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.tcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;cursor:pointer}
.tcard:active{transform:scale(.98)}
.tglyph{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:24px}
.tname{font-weight:800;font-size:14.5px;line-height:1.18}
.tprog{display:flex;align-items:center;gap:7px;margin-top:9px}
.tbar{flex:1;height:6px;border-radius:6px;background:#EEF0F4;overflow:hidden}
.tbar>i{display:block;height:100%;border-radius:6px}
.tpct{font-size:11px;font-weight:800;color:var(--faint)}
.tcard.empty{background:#F7F7F4;cursor:default}.tcard.empty .tname{color:#AEB4C1}
/* chips/seg */
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 20px 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.bchip{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;color:var(--muted);font-weight:800;font-size:13px;padding:9px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.bchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg{display:flex;gap:6px;padding:8px 20px}
.seg .g{flex:1;text-align:center;border:1.5px solid var(--line);background:#fff;font-weight:800;border-radius:12px;padding:9px 0;cursor:pointer;font-size:14px;color:var(--muted)}
.seg .g.on{background:var(--orange-l);border-color:var(--orange);color:var(--orange-d)}
/* list */
.li{display:flex;align-items:center;gap:13px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px 14px;margin-bottom:9px;cursor:pointer}
.li .ic{width:38px;height:38px;border-radius:11px;background:var(--orange-l);color:var(--orange-d);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.li .num{width:26px;height:26px;border-radius:8px;background:#F0F1F5;color:var(--muted);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
/* academic height */
.ah{margin:8px 20px;border-radius:22px;padding:18px;background:#fff;border:1px solid var(--line)}
.ah .verdict{font-family:'Baloo 2';font-size:24px;font-weight:800;line-height:1.1}
.ah .scorechip{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13px;padding:5px 11px;border-radius:999px;background:var(--green-l);color:var(--green)}
.gauge{height:14px;border-radius:999px;margin:16px 0 6px;display:flex;overflow:hidden;position:relative}
.gauge .z{height:100%} .gz1{background:#FBD9BE}.gz2{background:#A9E6CE}.gz3{background:#BBD2FB}
.gmark{position:absolute;top:-6px;width:4px;height:26px;border-radius:3px;background:var(--ink);transform:translateX(-2px)}
.glabels{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--faint)}
.ah .ex{margin-top:14px;background:#F8F8F5;border:1px solid var(--line);border-radius:13px;padding:12px 13px;font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.5}
.linkbtn{background:none;border:none;color:var(--orange-d);font-weight:800;font-size:12.5px;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:5px}
/* strands */
.strands{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.scard{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px}
.scard .top{display:flex;align-items:center;gap:11px}
.ringwrap{position:relative;width:46px;height:46px;flex:0 0 auto}
.ringwrap span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2';font-weight:800;font-size:13px}
.slabel{font-weight:800;font-size:12px;margin-top:11px;display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px}
/* practice */
.qcard{margin:6px 20px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px}
.opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;margin-top:9px;cursor:pointer;font-weight:700;background:#fff}
.opt .k{width:27px;height:27px;border-radius:8px;background:#F2F3F6;color:var(--muted);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
.opt.correct{background:var(--green-l);border-color:var(--green)} .opt.correct .k{background:var(--green);color:#fff}
.opt.wrong{background:#FDECEC;border-color:#EF4444} .opt.wrong .k{background:#EF4444;color:#fff}
.fbar{margin:12px 20px;border-radius:14px;padding:12px 15px;font-weight:800;display:none;font-size:14px}
.fbar.ok{background:var(--green-l);color:#0B7C5B;display:block}.fbar.no{background:#FDECEC;color:#C0392B;display:block}
.ghost{background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:12px 16px;font-weight:800;cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px}
.primary{background:var(--orange);color:#fff;border:none;border-radius:13px;padding:13px 18px;font-weight:800;cursor:pointer;width:100%;font-size:15px}
.pbar{height:7px;border-radius:7px;background:#EEF0F4;overflow:hidden}.pbar>i{display:block;height:100%;border-radius:7px;background:var(--orange)}
/* profile */
.phead{display:flex;align-items:center;gap:14px}
.avatar{width:62px;height:62px;border-radius:19px;background:linear-gradient(135deg,#FFB36B,#FF6D00);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Baloo 2';font-weight:800;font-size:25px;flex:0 0 auto}
.statgrid{display:flex;gap:9px;margin-top:14px}
.statgrid .b{flex:1;background:#F8F8F5;border-radius:14px;padding:11px;text-align:center}
.statgrid .b b{font-family:'Baloo 2';font-size:19px;display:block}.statgrid .b span{color:var(--muted);font-weight:700;font-size:11px}
.danger{color:#D8412F !important}.danger .ic{background:#FDEAE7;color:#D8412F}
/* nav */
.nav{position:absolute;left:0;right:0;bottom:0;height:82px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:9px 8px 22px;z-index:10}
.nav button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:#A7AEBC;font-weight:800;font-size:10.5px;padding-top:5px}
.nav button.on{color:var(--orange)}
.pin{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:228px;margin:14px auto}
.pin button{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;font-size:20px;font-weight:800;cursor:pointer;font-family:'Baloo 2';display:flex;align-items:center;justify-content:center}
.dots{display:flex;gap:13px;justify-content:center;margin:6px 0}.dots i{width:13px;height:13px;border-radius:50%;background:#E2E6EE}.dots i.f{background:var(--orange)}
.fade{animation:fade .22s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:18px 20px 28px;box-shadow:0 -10px 40px rgba(0,0,0,.16);z-index:20;animation:up .25s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.scrim{position:absolute;inset:0;background:rgba(20,22,29,.4);z-index:19;animation:fade .2s}
.wallet{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:0 18px 4px;flex:0 0 auto}
.wchip{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:13px;padding:5px 10px;border-radius:999px;background:#fff;border:1px solid var(--line)}
.wchip.flame{color:#FF6D00}.wchip.coin{color:#E68A00}.wchip.gem{color:#8B5CF6}
.arow{display:flex;gap:10px;overflow-x:auto;padding:2px 18px 4px;scrollbar-width:none}.arow::-webkit-scrollbar{display:none}
.award{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:72px;text-align:center;flex:0 0 auto}
.abadge{width:50px;height:50px;border-radius:15px;display:flex;align-items:center;justify-content:center;background:var(--orange-l);color:var(--orange-d)}
.award.locked .abadge{background:#F0F1F5;color:#C2C8D2}
.award .an{font-size:10.5px;font-weight:800;line-height:1.15;color:var(--muted)}.award.locked .an{color:var(--faint)}
.toast{position:absolute;left:50%;top:96px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:800;font-size:13px;padding:10px 15px;border-radius:14px;z-index:30;display:flex;align-items:center;gap:7px;box-shadow:0 8px 24px rgba(0,0,0,.22);animation:pop .3s ease;white-space:nowrap}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%)}}
</style>
</head>

 const lv=DATA.olympiad.find(l=>l.level===S.oly.level);
 let h=`<div class="appbar"><div class="back" onclick="setTab('olympiad')">${ic('back',20)}</div>
   <div><h1>Level ${lv.level.slice(1)}</h1><div class="sub">${bandName(lv.level_name)} · pick a topic</div></div></div>`;
 h+=`<div class="wrap"><div class="grid">`;
 lv.topics.forEach((t,i)=>{
   const empty=t.count===0;
   const prog=empty?0:[0,15,40,70,100][i%5];
   const col=PHEX[t.pillar];
   h+=`<div class="tcard ${empty?'empty':''}" ${empty?'':`onclick="openTopic('${t.topic_key}','${t.display_name.replace(/'/g,'')}')"`}>
     <div class="tglyph" style="background:${empty?'#EEF0F4':PLT[t.pillar]}">${empty?'':pglyph(t.pillar)}</div>
     <div class="tname">${t.display_name}</div>
     ${empty?`<div class="tprog"><span class="tpct">Coming soon</span></div>`
       :`<div class="tprog"><div class="tbar"><i style="width:${prog}%;background:${col}"></i></div><span class="tpct">${prog?prog+'%':'Start'}</span></div>`}</div>`;
 });
 return h+`</div></div>`;
}
function openTopic(key,name){S.practice=makePractice('oly',key,name);S.oly.view='practice';render();}

/* ---------- SCHOOL (chapters sequenced) ---------- */
function chapNum(name){const m=String(name).match(/^\s*(?:ch\.?|chapter)?\s*(\d+)\s*([A-Za-z])?/i);if(m)return parseInt(m[1])*100+(m[2]?m[2].toUpperCase().charCodeAt(0)-64:0);return 1e6;}
function schoolScreen(){
 if(S.school.view==='practice')return practiceScreen('School');
 const b=S.school.board,g=S.school.grade,cur=DATA.curriculum[b].grades[g];
 const chaps=(cur.chapters||[]).slice().sort((a,c)=>chapNum(a.name)-chapNum(c.name)||a.name.localeCompare(c.name));
 let h=`<div class="appbar"><div><h1>School</h1><div class="sub">Your curriculum, chapter by chapter</div></div></div>`;
 h+=`<div class="chips">`+DATA.curriculum_order.map(k=>`<div class="bchip ${k===b?'on':''}" onclick="selBoard('${k}')">${DATA.curriculum[k].name}</div>`).join('')+`</div>`;
 h+=`<div class="seg">`+[1,2,3,4,5,6].map(n=>`<div class="g ${n===g?'on':''}" onclick="selGrade(${n})">G${n}</div>`).join('')+`</div>`;
 h+=`<div class="wrap"><div class="eyebrow">${DATA.curriculum[b].name} · Grade ${g}</div>`;
 if(!chaps.length)h+=`<div class="li" style="cursor:default"><div class="meta">No chapters mapped yet.</div></div>`;
 chaps.forEach((c,i)=>{
   const clean=c.name.replace(/^\s*(ch\.?|chapter)?\s*\d+[A-Za-z]?\s*[:.\-]?\s*/i,'').trim()||c.name;
   h+=`<div class="li" onclick="openChapter('${clean.replace(/'/g,'')}')">
     <div class="num">${i+1}</div><div class="grow"><div class="title" style="font-size:14.5px">${clean}</div></div>${ic('chev',18,'#C9CFDA')}</div>`;
 });
 return h+`</div>`;
}
function selBoard(b){S.school.board=b;render();}
function selGrade(g){S.school.grade=g;render();}
function openChapter(name){S.practice=makePractice('school',String(S.school.grade),name);S.school.view='practice';render();}

/* ---------- PRACTICE ---------- */
function makePractice(kind,key,topicName){const pool=kind==='school'?DATA.samples.school:DATA.samples.oly;const fb=Object.values(DATA.samples.oly)[0];return {topic:topicName,q:(pool&&pool[key])||fb,pillar:kind==='oly'?pillarOf(key):null,picked:null,idx:3,total:10};}
function practiceScreen(origin){
 const p=S.practice,q=p.q;const back=origin==='School'?`S.school.view='home';render()`:`S.oly.view='topics';render()`;
 let h=`<div class="appbar"><div class="back" onclick="${back}">${ic('back',20)}</div><div class="grow"><h1 style="font-size:19px">${p.topic}</h1><div class="sub">${origin} practice</div></div></div>`;
 h+=`<div class="wrap"><div class="pbar"><i style="width:${p.idx/p.total*100}%"></i></div></div>`;
 h+=`<div class="qcard"><div style="font-weight:800;font-size:18px;line-height:1.3">${q.stem||'Sample question'}</div>`;
 const L=['A','B','C','D','E','F'];(q.choices&&q.choices.length?q.choices:['A','B','C','D']).forEach((c,i)=>{h+=`<div class="opt" id="opt${i}" onclick="pick(${i})"><div class="k">${L[i]}</div><div>${c}</div></div>`;});
 h+=`</div><div class="fbar" id="fbar"></div>`;
 h+=`<div class="wrap"><button class="ghost" style="width:100%;margin-bottom:10px" onclick="hint()">${ic('bulb',18,'#E65100')} Need a hint?</button>
   <div id="hintbox" style="display:none;background:var(--orange-l);border-radius:13px;padding:12px;font-weight:700;color:var(--orange-d);margin-bottom:10px;font-size:13.5px"></div>
   <button class="primary" onclick="nextQ()">Next question →</button></div>`;
 return h;
}
function pick(i){const p=S.practice,q=p.q;if(p.picked!==null)return;p.picked=i;const ca=(typeof q.correct_answer==='number')?q.correct_answer:0;
 document.getElementById('opt'+i).classList.add(i===ca?'correct':'wrong');if(i!==ca){const e=document.getElementById('opt'+ca);if(e)e.classList.add('correct');}
 STU.answered++;const f=document.getElementById('fbar');
 if(i===ca){STU.xp+=10;STU.coins+=5;STU.correctStreak++;STU.score=Math.min(800,STU.score+1);
   if(p.pillar&&STU.strands){const s=STU.strands.find(x=>x.p===p.pillar);if(s)s.pct=Math.min(100,s.pct+1);}
   if(STU.correctStreak%5===0)STU.gems+=1;
   f.className='fbar ok';f.textContent='Correct! +10 XP · +5 coins';}
 else{STU.xp+=2;STU.correctStreak=0;f.className='fbar no';f.textContent='Not quite — see the answer. +2 XP for trying';}
 checkAwards();renderWallet();}
function hint(){const b=document.getElementById('hintbox');b.style.display='block';b.textContent=S.practice.q.hint||'Break it into smaller steps using the numbers given.';}
function nextQ(){S.practice.picked=null;S.practice.idx=Math.min(S.practice.total,S.practice.idx+1);render();}

/* ---------- PROGRESS ---------- */
function ahVerdict(){const s=STU.score,[lo,hi]=STU.band;if(s<lo)return{t:'Building foundations',c:'var(--orange-d)',bg:'var(--orange-l)',msg:'We’re strengthening the basics for Grade '+STU.grade+'. Steady practice moves this up.'};if(s<=hi)return{t:'On track',c:'var(--green)',bg:'var(--green-l)',msg:'Right where Ved should be for Grade '+STU.grade+'. Keep the streak going.'};return{t:'Ahead of grade',c:'var(--blue)',bg:'var(--blue-l)',msg:'Working above Grade '+STU.grade+' level — time to stretch with harder topics.'};}
function progressScreen(){
 const v=ahVerdict(),[lo,hi]=STU.band,minS=lo-80,maxS=hi+80;
 const pos=Math.max(3,Math.min(97,(STU.score-minS)/(maxS-minS)*100));
 const z1=(lo-minS)/(maxS-minS)*100,z2=(hi-minS)/(maxS-minS)*100;
 let h=`<div class="appbar"><div><h1>Progress</h1><div class="sub">How ${STU.name} is growing</div></div></div>`;
 h+=`<div class="ah"><div class="row"><div class="grow"><div class="faint" style="font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:1px">Academic height</div>
   <div class="verdict" style="color:${v.c}">${v.t}</div></div>
   <div class="scorechip" style="background:${v.bg};color:${v.c}">${ic('trend',15)} +${STU.delta} this month</div></div>`;
 h+=`<div class="gauge"><div class="z gz1" style="width:${z1}%"></div><div class="z gz2" style="width:${z2-z1}%"></div><div class="z gz3" style="width:${100-z2}%"></div><div class="gmark" style="left:${pos}%"></div></div>`;
 h+=`<div class="glabels"><span>Building</span><span style="color:${v.c}">${STU.name} is here</span><span>Ahead</span></div>`;
 h+=`<div style="margin-top:14px;display:flex;align-items:center;justify-content:space-between"><div class="meta" style="font-weight:800">Around the Grade ${STU.grade} average <span class="faint">· ${STU.score} of 800</span></div>
   <button class="linkbtn" onclick="ahToggle()">${ic('info',15)} What's this?</button></div>`;
 if(S.ahOpen)h+=`<div class="ex">We turn how hard the questions ${STU.name} gets right into a score from <b>200 to 800</b>, like a standardised test. <b>500</b> is a typical Grade ${STU.grade} score and <b>800</b> is exceptional — ${STU.name} is at <b>${STU.score}</b>, just above average. We only ever compare ${STU.name} to last week, never to other kids.</div>`;
 h+=`</div>`;
 h+=`<div class="wrap"><div class="statgrid">
   <div class="b">${ic('flame',20,'#FF6D00')}<b>${STU.streak}</b><span>Day streak</span></div>
   <div class="b">${ic('grad',20,'#8B5CF6')}<b>${STU.topicsMastered}</b><span>Topics mastered</span></div>
   <div class="b">${ic('target',20,'#0FB17E')}<b>${STU.score}</b><span>Scale score</span></div></div></div>`;
 const slab=p=>p>=75?['Strong','var(--green)','var(--green-l)']:p>=55?['Growing','#E65100','var(--orange-l)']:['Keep practising','var(--muted)','#F0F1F5'];
 const scard=s=>{const col=PHEX[s.p],lab=slab(s.pct);return `<div class="scard"><div class="top"><div class="ringwrap">${ring(s.pct,46,col)}<span style="color:${col}">${s.pct}%</span></div>
   <div class="grow"><div class="title" style="font-size:13.5px">${s.n}</div><div class="meta" style="font-size:12px">${s.topics} topics</div></div></div>
   <div class="slabel" style="color:${lab[1]};background:${lab[2]}">${lab[0]}</div></div>`;};
 h+=`<div class="wrap"><div class="eyebrow">Mastery — the 4 pillars</div><div class="strands">`+STU.strands.slice(0,4).map(scard).join('')+`</div>`;
 const s5=STU.strands[4],c5=PHEX[s5.p],l5=slab(s5.pct);
 h+=`<div class="eyebrow" style="margin-top:14px">Plus · Logic & Puzzles</div><div class="scard"><div class="top"><div class="ringwrap">${ring(s5.pct,46,c5)}<span style="color:${c5}">${s5.pct}%</span></div>
   <div class="grow"><div class="title" style="font-size:14px">${s5.n}</div><div class="meta" style="font-size:12px">${s5.topics} topics · spans all pillars</div></div>
   <div class="slabel" style="color:${l5[1]};background:${l5[2]}">${l5[0]}</div></div></div>`;
 h+=`</div>`;
 h+=`<div class="wrap"><div class="eyebrow">Awards</div></div><div class="arow">`+AWARDS.map(a=>{const on=!!STU.awards[a.id];return `<div class="award ${on?'':'locked'}"><div class="abadge">${ic(a.ic,24)}</div><div class="an">${a.n}</div></div>`;}).join('')+`</div>`;
 h+=`<div class="wrap"><div class="eyebrow">Today</div><div class="li" onclick="alert('Daily puzzle (mock)')"><div class="ic" style="background:var(--alg-l);color:var(--alg)">${ic('star',20)}</div>
   <div class="grow"><div class="title" style="font-size:14.5px">Daily puzzle</div><div class="meta">Solve to keep your ${STU.streak}-day streak</div></div>${ic('chev',18,'#C9CFDA')}</div></div>`;
 return h;
}

/* ---------- PROFILE ---------- */
function profileScreen(){
 if(S.parent.open)return parentScreen();
 let h=`<div class="appbar"><div class="grow"><h1>Profile</h1></div><div class="back" onclick="openSheet('edit')">${ic('edit',18)}</div></div>`;
 h+=`<div class="wrap"><div class="phead"><div class="avatar">V</div><div class="grow"><div class="title" style="font-size:20px">${STU.name}</div>
   <div class="meta">Level ${STU.level.slice(1)} · Grade ${STU.grade} · ${STU.board}</div></div></div>
   <div class="statgrid"><div class="b">${ic('coin',20,'#FF6D00')}<b>${STU.coins}</b><span>Kiwi Coins</span></div>
   <div class="b">${ic('gem',20,'#8B5CF6')}<b>${STU.gems}</b><span>Mastery Gems</span></div>
   <div class="b">${ic('star',20,'#0FB17E')}<b>${fmtK(STU.xp)}</b><span>XP</span></div></div></div>`;
 h+=`<div class="wrap"><div class="eyebrow">Account</div>`;
 h+=row('edit','Edit profile','Name, avatar, level & grade',`openSheet('edit')`);
 h+=row('users','Switch learner','Ved · add a sibling',`openSheet('switch')`);
 h+=row('shield','Parent dashboard','PIN protected',`S.parent.open=true;S.parent.pin='';render()`);
 h+=`<div class="eyebrow">App</div>`;
 h+=row('bell','Notifications','Daily reminder · 6 PM',`openSheet('soon')`);
 h+=row('globe','Language & region','English · India',`openSheet('soon')`);
 h+=row('info','About Kiwimath','Version 2.0',`openSheet('soon')`);
 h+=`<div class="li danger" onclick="openSheet('signout')"><div class="ic">${ic('out',20)}</div><div class="grow"><div class="title danger" style="font-size:14.5px">Sign out</div></div></div>`;
 return h+`</div>`;
}
function row(icn,t,m,act){return `<div class="li" onclick="${act}"><div class="ic">${ic(icn,20)}</div><div class="grow"><div class="title" style="font-size:14.5px">${t}</div>${m?`<div class="meta">${m}</div>`:''}</div>${ic('chev',18,'#C9CFDA')}</div>`;}

/* ---------- PARENT ---------- */
function parentScreen(){
 const ok=S.parent.pin.length>=4,v=ahVerdict();
 let h=`<div class="appbar"><div class="back" onclick="S.parent.open=false;render()">${ic('back',20)}</div><div><h1 style="font-size:21px">Parent dashboard</h1><div class="sub">${ok?STU.name+' · Grade '+STU.grade+' · '+STU.board:'Enter your 4-digit PIN'}</div></div></div>`;
 if(!ok){h+=`<div class="wrap" style="text-align:center;margin-top:12px"><div class="dots">`+[0,1,2,3].map(i=>`<i class="${i<S.parent.pin.length?'f':''}"></i>`).join('')+`</div>`;
   h+=`<div class="pin">`+[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="pin(${n})">${n}</button>`).join('')+`<button onclick="pinDel()">${ic('back',20)}</button><button onclick="pin(0)">0</button><button onclick="render()">${ic('check',20,'#0FB17E')}</button></div>`;
   h+=`<div class="meta" style="margin-top:8px">A PIN, not a maths problem — so the Olympiad kids can't crack it.</div></div>`;return h;}
 h+=`<div class="ah"><div class="faint" style="font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:1px">Academic height</div>
   <div class="verdict" style="color:${v.c}">${v.t} for Grade ${STU.grade}</div><div class="ex" style="margin-top:10px">${v.msg}</div>
   <div style="margin-top:12px" class="meta">Scale score <b style="color:var(--ink)">${STU.score}</b> of 800 — Grade ${STU.grade} average ≈ 500 · up ${STU.delta} this month</div></div>`;
 h+=`<div class="wrap"><div class="statgrid"><div class="b"><b>81%</b><span>Accuracy</span></div><div class="b"><b>18/37</b><span>Skills mastered</span></div><div class="b"><b>5</b><span>Days/week</span></div></div>`;
 h+=`<div class="eyebrow">Strengths</div><div class="li" style="cursor:default"><div class="ic" style="background:var(--green-l);color:var(--green)">${ic('check',20)}</div><div class="grow"><div class="title" style="font-size:14px">Number sense, Patterns</div></div></div>`;
 h+=`<div class="eyebrow">Needs practice</div><div class="li" style="cursor:default"><div class="ic" style="background:var(--orange-l);color:var(--orange-d)">${ic('target',20)}</div><div class="grow"><div class="title" style="font-size:14px">Geometry — angles & area</div></div></div>`;
 h+=`<div class="meta" style="text-align:center;margin-top:8px">No coins or gems here — only real learning.</div></div>`;
 return h;
}
function pin(n){if(S.parent.pin.length<4){S.parent.pin+=n;render();}}
function pinDel(){S.parent.pin=S.parent.pin.slice(0,-1);render();}

/* ---------- sheets ---------- */
function openSheet(k){S.sheet=k;document.getElementById('overlay').innerHTML=sheetHTML();}
function closeSheet(){S.sheet=null;document.getElementById('overlay').innerHTML='';}
function sheetHTML(){
 const body={
  edit:`<h2 style="font-size:19px">Edit profile</h2><div class="meta" style="margin:10px 0 4px">Name</div><div class="li" style="cursor:default">Ved</div><div class="meta" style="margin:6px 0 4px">Grade</div><div class="seg" style="padding:0">${[3,4,5,6].map(n=>`<div class="g ${n===5?'on':''}">G${n}</div>`).join('')}</div><button class="primary" style="margin-top:14px" onclick="closeSheet()">Save</button>`,
  switch:`<h2 style="font-size:19px">Switch learner</h2>${row('user','Ved','Grade 5 · active','closeSheet()')}<div class="li" onclick="closeSheet()"><div class="ic" style="background:var(--orange-l);color:var(--orange-d)">${ic('users',20)}</div><div class="grow"><div class="title" style="font-size:14.5px">Add a learner</div><div class="meta">Up to 4 children per account</div></div></div>`,
  signout:`<h2 style="font-size:19px">Sign out?</h2><div class="meta" style="margin:8px 0 16px">${STU.name}'s progress is saved to your account. You can sign back in anytime.</div><button class="primary danger" style="background:#D8412F" onclick="closeSheet()">Sign out</button><button class="ghost" style="width:100%;margin-top:9px" onclick="closeSheet()">Cancel</button>`,
  soon:`<h2 style="font-size:19px">Coming soon</h2><div class="meta" style="margin:8px 0 14px">This setting isn't wired up in the prototype.</div><button class="ghost" style="width:100%" onclick="closeSheet()">Close</button>`
 }[S.sheet]||'';
 return `<div class="scrim" onclick="closeSheet()"></div><div class="sheet">${body}</div>`;
}
seedAwards();render();
</script>
</body>
</html>
