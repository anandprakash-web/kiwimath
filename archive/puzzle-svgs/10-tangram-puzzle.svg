<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Tangram/Dissection Puzzle (Yoshigahara Ch9) -->
  <defs>
    <linearGradient id="piece1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E53935"/><stop offset="100%" style="stop-color:#C62828"/>
    </linearGradient>
    <linearGradient id="piece2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E88E5"/><stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
    <linearGradient id="piece3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43A047"/><stop offset="100%" style="stop-color:#2E7D32"/>
    </linearGradient>
    <linearGradient id="piece4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FB8C00"/><stop offset="100%" style="stop-color:#EF6C00"/>
    </linearGradient>
    <linearGradient id="piece5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8E24AA"/><stop offset="100%" style="stop-color:#6A1B9A"/>
    </linearGradient>
    <linearGradient id="piece6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00897B"/><stop offset="100%" style="stop-color:#00695C"/>
    </linearGradient>
    <linearGradient id="piece7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDD835"/><stop offset="100%" style="stop-color:#F9A825"/>
    </linearGradient>
    <filter id="pieceShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="#FFF3E0" rx="12"/>
  <text x="300" y="32" text-anchor="middle" font-family="Georgia" font-size="20" fill="#BF360C" font-weight="bold">Tangram Challenge</text>
  <text x="300" y="52" text-anchor="middle" font-family="Georgia" font-size="12" fill="#795548" font-style="italic">Arrange all 7 pieces to form the shape on the right!</text>
  <!-- LEFT: Scattered pieces -->
  <text x="150" y="80" text-anchor="middle" font-family="Arial" font-size="14" fill="#5D4037" font-weight="bold">YOUR PIECES</text>
  <!-- Large triangle 1 -->
  <polygon points="40,120 140,120 90,200" fill="url(#piece1)" filter="url(#pieceShadow)" stroke="#B71C1C" stroke-width="1.5"/>
  <!-- Large triangle 2 -->
  <polygon points="160,110 260,110 210,190" fill="url(#piece2)" filter="url(#pieceShadow)" stroke="#0D47A1" stroke-width="1.5"/>
  <!-- Medium triangle -->
  <polygon points="50,220 120,220 85,270" fill="url(#piece3)" filter="url(#pieceShadow)" stroke="#1B5E20" stroke-width="1.5"/>
  <!-- Small triangle 1 -->
  <polygon points="140,220 190,220 165,255" fill="url(#piece4)" filter="url(#pieceShadow)" stroke="#E65100" stroke-width="1.5"/>
  <!-- Small triangle 2 -->
  <polygon points="210,220 260,220 235,255" fill="url(#piece5)" filter="url(#pieceShadow)" stroke="#4A148C" stroke-width="1.5"/>
  <!-- Square -->
  <rect x="60" y="285" width="50" height="50" fill="url(#piece6)" filter="url(#pieceShadow)" stroke="#004D40" stroke-width="1.5" transform="rotate(45 85 310)"/>
  <!-- Parallelogram -->
  <polygon points="170,290 240,290 260,340 190,340" fill="url(#piece7)" filter="url(#pieceShadow)" stroke="#F57F17" stroke-width="1.5"/>
  <!-- Arrow -->
  <path d="M290 210 L330 210" stroke="#795548" stroke-width="3" marker-end="url(#brownArrow)"/>
  <defs>
    <marker id="brownArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#795548"/>
    </marker>
  </defs>
  <!-- RIGHT: Target shape (cat silhouette made from square outline) -->
  <text x="460" y="80" text-anchor="middle" font-family="Arial" font-size="14" fill="#5D4037" font-weight="bold">MAKE THIS SHAPE</text>
  <!-- Cat silhouette outline -->
  <polygon points="370,100 390,100 390,120 400,110 410,120 410,100 530,100 530,350 370,350"
           fill="none" stroke="#3E2723" stroke-width="3" stroke-dasharray="8,4"/>
  <!-- Faint grid inside target -->
  <line x1="370" y1="162" x2="530" y2="162" stroke="#D7CCC8" stroke-width="0.5"/>
  <line x1="370" y1="225" x2="530" y2="225" stroke="#D7CCC8" stroke-width="0.5"/>
  <line x1="370" y1="287" x2="530" y2="287" stroke="#D7CCC8" stroke-width="0.5"/>
  <line x1="450" y1="100" x2="450" y2="350" stroke="#D7CCC8" stroke-width="0.5"/>
  <!-- Question mark in center of target -->
  <text x="450" y="240" text-anchor="middle" font-family="Georgia" font-size="48" fill="#BCAAA4" opacity="0.5">?</text>
  <!-- Bottom instruction -->
  <rect x="140" y="365" width="320" height="28" fill="#5D4037" rx="6"/>
  <text x="300" y="384" text-anchor="middle" font-family="Arial" font-size="12" fill="white">Drag and rotate pieces to fill the shape!</text>
</svg>
