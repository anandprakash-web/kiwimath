<svg viewBox="0 0 600 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Three Treasure Caskets (Smullyan: Portia's Caskets) -->
  <defs>
    <linearGradient id="goldBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#FFC107"/>
      <stop offset="100%" style="stop-color:#FF8F00"/>
    </linearGradient>
    <linearGradient id="silverBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E0E0E0"/>
      <stop offset="50%" style="stop-color:#BDBDBD"/>
      <stop offset="100%" style="stop-color:#9E9E9E"/>
    </linearGradient>
    <linearGradient id="bronzeBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CD7F32"/>
      <stop offset="50%" style="stop-color:#B8860B"/>
      <stop offset="100%" style="stop-color:#8B6914"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="350" fill="#1A0A2E" rx="12"/>
  <text x="300" y="35" text-anchor="middle" font-family="Georgia" font-size="20" fill="#FFD700" font-weight="bold">The Three Treasure Chests</text>
  <text x="300" y="55" text-anchor="middle" font-family="Georgia" font-size="12" fill="#B388FF" font-style="italic">One chest has the diamond. Exactly one clue is TRUE.</text>
  <!-- Gold Chest -->
  <rect x="30" y="80" width="160" height="100" fill="url(#goldBox)" rx="8" stroke="#E65100" stroke-width="2"/>
  <rect x="30" y="80" width="160" height="20" fill="#E65100" rx="8" opacity="0.3"/>
  <rect x="95" y="75" width="30" height="15" fill="#FFD700" rx="4" stroke="#E65100" stroke-width="1.5"/>
  <circle cx="110" cy="130" r="8" fill="#E65100" stroke="#BF360C" stroke-width="1.5"/>
  <text x="110" y="70" text-anchor="middle" font-family="Georgia" font-size="16" fill="#FFD700" font-weight="bold">GOLD</text>
  <!-- Gold clue -->
  <rect x="35" y="195" width="150" height="55" fill="#FFF8E1" rx="6" stroke="#FFB300" stroke-width="1.5"/>
  <text x="110" y="216" text-anchor="middle" font-family="Georgia" font-size="11" fill="#3E2723" font-style="italic">"The diamond is</text>
  <text x="110" y="232" text-anchor="middle" font-family="Georgia" font-size="11" fill="#3E2723" font-style="italic">in this chest."</text>
  <!-- Silver Chest -->
  <rect x="220" y="80" width="160" height="100" fill="url(#silverBox)" rx="8" stroke="#616161" stroke-width="2"/>
  <rect x="220" y="80" width="160" height="20" fill="#616161" rx="8" opacity="0.3"/>
  <rect x="285" y="75" width="30" height="15" fill="#BDBDBD" rx="4" stroke="#616161" stroke-width="1.5"/>
  <circle cx="300" cy="130" r="8" fill="#616161" stroke="#424242" stroke-width="1.5"/>
  <text x="300" y="70" text-anchor="middle" font-family="Georgia" font-size="16" fill="#E0E0E0" font-weight="bold">SILVER</text>
  <!-- Silver clue -->
  <rect x="225" y="195" width="150" height="55" fill="#F5F5F5" rx="6" stroke="#9E9E9E" stroke-width="1.5"/>
  <text x="300" y="216" text-anchor="middle" font-family="Georgia" font-size="11" fill="#3E2723" font-style="italic">"The diamond is</text>
  <text x="300" y="232" text-anchor="middle" font-family="Georgia" font-size="11" fill="#3E2723" font-style="italic">NOT in the gold chest."</text>
  <!-- Bronze Chest -->
  <rect x="410" y="80" width="160" height="100" fill="url(#bronzeBox)" rx="8" stroke="#5D4037" stroke-width="2"/>
  <rect x="410" y="80" width="160" height="20" fill="#5D4037" rx="8" opacity="0.3"/>
  <rect x="475" y="75" width="30" height="15" fill="#CD7F32" rx="4" stroke="#5D4037" stroke-width="1.5"/>
  <circle cx="490" cy="130" r="8" fill="#5D4037" stroke="#3E2723" stroke-width="1.5"/>
  <text x="490" y="70" text-anchor="middle" font-family="Georgia" font-size="16" fill="#CD7F32" font-weight="bold">BRONZE</text>
  <!-- Bronze clue -->
  <rect x="415" y="195" width="150" height="55" fill="#EFEBE9" rx="6" stroke="#8D6E63" stroke-width="1.5"/>
  <text x="490" y="216" text-anchor="middle" font-family="Georgia" font-size="11" fill="#3E2723" font-style="italic">"The diamond is</text>
  <text x="490" y="232" text-anchor="middle" font-family="Georgia" font-size="11" fill="#3E2723" font-style="italic">NOT in this chest."</text>
  <!-- Bottom instruction -->
  <rect x="120" y="270" width="360" height="65" fill="#311B92" rx="10" opacity="0.7"/>
  <text x="300" y="295" text-anchor="middle" font-family="Georgia" font-size="14" fill="#FFD700">Which chest has the diamond?</text>
  <text x="300" y="318" text-anchor="middle" font-family="Arial" font-size="12" fill="#B388FF">Tap a chest to open it!</text>
</svg>