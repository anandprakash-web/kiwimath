<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Sliding 15 Puzzle (Sam Loyd classic) -->
  <defs>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#42A5F5"/>
      <stop offset="50%" style="stop-color:#1E88E5"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
    <filter id="tileShadow">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="#263238" rx="12"/>
  <text x="300" y="30" text-anchor="middle" font-family="Georgia" font-size="20" fill="#FFD700" font-weight="bold">The Sliding Puzzle</text>
  <text x="300" y="50" text-anchor="middle" font-family="Georgia" font-size="12" fill="#B0BEC5" font-style="italic">Slide tiles to arrange 1-15 in order!</text>
  <!-- Board frame -->
  <rect x="168" y="62" width="264" height="264" fill="#37474F" rx="6" stroke="#455A64" stroke-width="3"/>
  <!-- 4x4 grid of tiles (each 60x60 with 3px gap) -->
  <!-- Row 1 -->
  <rect x="174" y="68" width="60" height="60" fill="url(#tileGrad)" rx="6" filter="url(#tileShadow)"/>
  <text x="204" y="106" text-anchor="middle" font-family="Arial" font-size="26" fill="white" font-weight="bold">1</text>
  <rect x="240" y="68" width="60" height="60" fill="url(#tileGrad)" rx="6" filter="url(#tileShadow)"/>
  <text x="270" y="106" text-anchor="middle" font-family="Arial" font-size="26" fill="white" font-weight="bold">2</text>
  <rect x="306" y="68" width="60" height="60" fill="url(#tileGrad)" rx="6" filter="url(#tileShadow)"/>
  <text x="336" y="106" text-anchor="middle" font-family="Arial" font-size="26" fill="white" font-weight="bold">3</text>
  <rect x="372" y="68" width="60" height="60" fill="url(#tileGrad)" rx="6" filter="url(#tileShadow)"/>
  <text x="402" y="106" text-anchor="middle" font-family="Arial" font-size="26" fill="white" font-weight="bold">4</text>
  <!-- Row 2 -->
  <rect x="174" y="134" width="60" height="60" fill="url(#tileGrad)" rx="6" filter="url(#tileShadow)"/>
  <text x="204" y="172" text-anchor="middle" font-family="Arial" font-size="26" fill="white" font-weight="bold">5</text>
  <rect x="240" y="134" width="60" height="60" fill="url(#tileGrad)" rx="6" filter="url(#tileShadow)"/>
  <text x="270" y="172" text-anchor="middle" font-family="Arial" font-size="26" fill="white" font-weight="bold">6</text>
  <rect x="306" y="134" width="60" height="60" fill="url(#tileGrad)" rx="6" filter="url(#tileShadow)"/>
  <text x="336" y="172" text-anchor="middle" font-family="Arial" font-size="26" fill="white" font-weight="bold">7</text>
  <rect x="372" y="134" width="60" height="60" fill="url(#tileGrad)" rx="6" filter="url(#tileShadow)"/>
  <text x="402" y="172" text-anchor="middle" font-family="Arial" font-size="26" fill="white" font-weight="bold">8</text>
  <!-- Row 3 -->
  <rect x="174" y="200" width="60" height="60" fill="url(#tileGrad)" rx="6" filter="url(#tileShadow)"/>
  <text x="204" y="238" text-anchor="middle" font-family="Arial" font-size="26" fill="white" font-weight="bold">9</text>
  <rect x="240" y="200" width="60" height="60" fill="url(#tileGrad)" rx="6" filter="url(#tileShadow)"/>
  <text x="270" y="238" text-anchor="middle" font-family="Arial" font-size="26" fill="white" font-weight="bold">10</text>
  <rect x="306" y="200" width="60" height="60" fill="url(#tileGrad)" rx="6" filter="url(#tileShadow)"/>
  <text x="336" y="238" text-anchor="middle" font-family="Arial" font-size="26" fill="white" font-weight="bold">11</text>
  <rect x="372" y="200" width="60" height="60" fill="url(#tileGrad)" rx="6" filter="url(#tileShadow)"/>
  <text x="402" y="238" text-anchor="middle" font-family="Arial" font-size="26" fill="white" font-weight="bold">12</text>
  <!-- Row 4 -->
  <rect x="174" y="266" width="60" height="60" fill="url(#tileGrad)" rx="6" filter="url(#tileShadow)"/>
  <text x="204" y="304" text-anchor="middle" font-family="Arial" font-size="26" fill="white" font-weight="bold">13</text>
  <rect x="240" y="266" width="60" height="60" fill="url(#tileGrad)" rx="6" filter="url(#tileShadow)"/>
  <text x="270" y="304" text-anchor="middle" font-family="Arial" font-size="26" fill="#FFD54F" font-weight="bold">15</text>
  <rect x="306" y="266" width="60" height="60" fill="url(#tileGrad)" rx="6" filter="url(#tileShadow)"/>
  <text x="336" y="304" text-anchor="middle" font-family="Arial" font-size="26" fill="#FFD54F" font-weight="bold">14</text>
  <!-- Empty space -->
  <rect x="372" y="266" width="60" height="60" fill="#455A64" rx="6" stroke="#546E7A" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Scrambled indicator -->
  <text x="270" y="290" text-anchor="middle" font-family="Arial" font-size="10" fill="#FF5722">swapped!</text>
  <!-- Info panels -->
  <rect x="30" y="70" width="125" height="140" fill="#37474F" rx="8" opacity="0.9"/>
  <text x="92" y="95" text-anchor="middle" font-family="Georgia" font-size="13" fill="#FFD700" font-weight="bold">How to Play</text>
  <text x="42" y="118" font-family="Arial" font-size="11" fill="#E0E0E0">Tap a tile next</text>
  <text x="42" y="133" font-family="Arial" font-size="11" fill="#E0E0E0">to the empty</text>
  <text x="42" y="148" font-family="Arial" font-size="11" fill="#E0E0E0">space to slide it.</text>
  <text x="42" y="173" font-family="Arial" font-size="11" fill="#81D4FA">Goal: Order 1-15</text>
  <text x="42" y="188" font-family="Arial" font-size="11" fill="#81D4FA">with blank at end.</text>
  <!-- Sam Loyd's challenge -->
  <rect x="445" y="70" width="140" height="140" fill="#B71C1C" rx="8" opacity="0.85"/>
  <text x="515" y="95" text-anchor="middle" font-family="Georgia" font-size="13" fill="#FFD700" font-weight="bold">Sam Loyd's Dare</text>
  <text x="457" y="118" font-family="Arial" font-size="11" fill="#FFCDD2">Can you swap just</text>
  <text x="457" y="133" font-family="Arial" font-size="11" fill="#FFCDD2">14 and 15 without</text>
  <text x="457" y="148" font-family="Arial" font-size="11" fill="#FFCDD2">changing anything</text>
  <text x="457" y="163" font-family="Arial" font-size="11" fill="#FFCDD2">else?</text>
  <text x="515" y="192" text-anchor="middle" font-family="Georgia" font-size="13" fill="#FFD54F" font-weight="bold">It's impossible!</text>
  <!-- Counter -->
  <rect x="30" y="230" width="125" height="50" fill="#455A64" rx="8"/>
  <text x="92" y="252" text-anchor="middle" font-family="Arial" font-size="11" fill="#B0BEC5">Moves</text>
  <text x="92" y="273" text-anchor="middle" font-family="Georgia" font-size="22" fill="#4CAF50" font-weight="bold">0</text>
  <!-- Bottom -->
  <rect x="120" y="345" width="360" height="40" fill="#1A237E" rx="8" opacity="0.7"/>
  <text x="300" y="365" text-anchor="middle" font-family="Georgia" font-size="13" fill="#FFD700">Slide tiles to solve the puzzle!</text>
  <text x="300" y="380" text-anchor="middle" font-family="Arial" font-size="11" fill="#9FA8DA">Tap any tile next to the empty space</text>
</svg>
