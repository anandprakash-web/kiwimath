<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Two Door Puzzle (Smullyan: Lady or Tiger) -->
  <defs>
    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5C3317;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="signGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8DC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5DEB3;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="#2C1810" rx="12"/>
  <!-- Stone wall texture -->
  <rect x="0" y="280" width="600" height="120" fill="#4A3728" rx="0"/>
  <text x="300" y="30" text-anchor="middle" font-family="Georgia" font-size="22" fill="#FFD700" font-weight="bold">The King's Challenge</text>
  <!-- Door 1 -->
  <rect x="80" y="60" width="160" height="220" fill="url(#doorGrad)" rx="8" stroke="#3E2723" stroke-width="3"/>
  <circle cx="220" cy="170" r="8" fill="#FFD700" stroke="#B8860B" stroke-width="2"/>
  <rect x="85" y="65" width="150" height="10" fill="#6B3A2A" rx="2"/>
  <text x="160" y="50" text-anchor="middle" font-family="Georgia" font-size="18" fill="#FFD700">Door I</text>
  <!-- Sign on Door 1 -->
  <rect x="100" y="300" width="120" height="70" fill="url(#signGrad)" rx="6" stroke="#8B7355" stroke-width="2"/>
  <text x="160" y="325" text-anchor="middle" font-family="Georgia" font-size="11" fill="#3E2723" font-style="italic">"In this room</text>
  <text x="160" y="340" text-anchor="middle" font-family="Georgia" font-size="11" fill="#3E2723" font-style="italic">there is a lady"</text>
  <text x="160" y="362" text-anchor="middle" font-family="Georgia" font-size="9" fill="#8B4513">TRUE or FALSE?</text>
  <!-- Door 2 -->
  <rect x="360" y="60" width="160" height="220" fill="url(#doorGrad)" rx="8" stroke="#3E2723" stroke-width="3"/>
  <circle cx="380" cy="170" r="8" fill="#FFD700" stroke="#B8860B" stroke-width="2"/>
  <rect x="365" y="65" width="150" height="10" fill="#6B3A2A" rx="2"/>
  <text x="440" y="50" text-anchor="middle" font-family="Georgia" font-size="18" fill="#FFD700">Door II</text>
  <!-- Sign on Door 2 -->
  <rect x="380" y="300" width="120" height="70" fill="url(#signGrad)" rx="6" stroke="#8B7355" stroke-width="2"/>
  <text x="440" y="325" text-anchor="middle" font-family="Georgia" font-size="11" fill="#3E2723" font-style="italic">"A tiger is in</text>
  <text x="440" y="340" text-anchor="middle" font-family="Georgia" font-size="11" fill="#3E2723" font-style="italic">the other room"</text>
  <text x="440" y="362" text-anchor="middle" font-family="Georgia" font-size="9" fill="#8B4513">TRUE or FALSE?</text>
  <!-- Question marks behind doors -->
  <text x="160" y="190" text-anchor="middle" font-family="Georgia" font-size="60" fill="#3E272380">?</text>
  <text x="440" y="190" text-anchor="middle" font-family="Georgia" font-size="60" fill="#3E272380">?</text>
  <!-- Rule text -->
  <text x="300" y="395" text-anchor="middle" font-family="Georgia" font-size="12" fill="#FFD70090">Rule: At least one sign is true, at least one is false</text>
</svg>