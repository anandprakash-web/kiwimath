<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Kaprekar's Constant 6174 Visualization -->
  <defs>
    <linearGradient id="indiaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9933"/>
      <stop offset="50%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#138808"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="#1A1A2E" rx="12"/>
  <text x="300" y="30" text-anchor="middle" font-family="Georgia" font-size="20" fill="#FFD700" font-weight="bold">Kaprekar's Magic Number</text>
  <text x="300" y="50" text-anchor="middle" font-family="Georgia" font-size="12" fill="#81D4FA" font-style="italic">Discovered by Indian mathematician D.R. Kaprekar!</text>
  <!-- India flag accent -->
  <rect x="255" y="56" width="90" height="3" fill="#FF9933"/>
  <rect x="255" y="59" width="90" height="3" fill="white"/>
  <rect x="255" y="62" width="90" height="3" fill="#138808"/>
  <!-- Steps demonstration: Start with 3087 -->
  <!-- Step 0: Pick any 4-digit number -->
  <rect x="30" y="80" width="540" height="35" fill="#283593" rx="8" opacity="0.7"/>
  <text x="300" y="102" text-anchor="middle" font-family="Georgia" font-size="14" fill="#FFD700">Pick ANY 4-digit number (not all same digits): 3087</text>
  <!-- Step 1 -->
  <rect x="30" y="125" width="540" height="45" fill="#1B3A4B" rx="8" opacity="0.8"/>
  <text x="50" y="145" font-family="Arial" font-size="12" fill="#4FC3F7" font-weight="bold">Step 1:</text>
  <text x="110" y="145" font-family="monospace" font-size="13" fill="#E0E0E0">Arrange digits: largest first 8730 - smallest first 0378</text>
  <text x="490" y="145" font-family="monospace" font-size="15" fill="#4CAF50" font-weight="bold">8730</text>
  <text x="490" y="162" font-family="monospace" font-size="13" fill="#EF5350">- 0378</text>
  <line x1="475" y1="166" x2="530" y2="166" stroke="#FFD700" stroke-width="1"/>
  <text x="543" y="160" text-anchor="middle" font-family="monospace" font-size="15" fill="#FFD700" font-weight="bold">= 8352</text>
  <!-- Step 2 -->
  <rect x="30" y="180" width="540" height="45" fill="#1B3A4B" rx="8" opacity="0.8"/>
  <text x="50" y="200" font-family="Arial" font-size="12" fill="#4FC3F7" font-weight="bold">Step 2:</text>
  <text x="110" y="200" font-family="monospace" font-size="13" fill="#E0E0E0">Repeat: 8532 - 2358</text>
  <text x="543" y="205" text-anchor="middle" font-family="monospace" font-size="15" fill="#FFD700" font-weight="bold">= 6174</text>
  <!-- Step 3 -->
  <rect x="30" y="235" width="540" height="45" fill="#1B3A4B" rx="8" opacity="0.8"/>
  <text x="50" y="255" font-family="Arial" font-size="12" fill="#4FC3F7" font-weight="bold">Step 3:</text>
  <text x="110" y="255" font-family="monospace" font-size="13" fill="#E0E0E0">Again: 7641 - 1467</text>
  <text x="543" y="260" text-anchor="middle" font-family="monospace" font-size="15" fill="#FFD700" font-weight="bold">= 6174</text>
  <!-- Loop indicator -->
  <path d="M555 260 Q575 245 555 210" fill="none" stroke="#FF5722" stroke-width="2" marker-end="url(#loopArrow)"/>
  <text x="580" y="240" font-family="Arial" font-size="10" fill="#FF8A65">LOOP!</text>
  <defs>
    <marker id="loopArrow" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FF5722"/>
    </marker>
  </defs>
  <!-- Big 6174 display -->
  <rect x="150" y="295" width="300" height="60" fill="#0D47A1" rx="12" stroke="#FFD700" stroke-width="2"/>
  <text x="300" y="335" text-anchor="middle" font-family="Georgia" font-size="40" fill="#FFD700" font-weight="bold">6 1 7 4</text>
  <text x="300" y="350" text-anchor="middle" font-family="Arial" font-size="10" fill="#90CAF9">Kaprekar's Constant</text>
  <!-- Fun facts -->
  <rect x="30" y="365" width="540" height="28" fill="#263238" rx="6" opacity="0.8"/>
  <text x="300" y="383" text-anchor="middle" font-family="Arial" font-size="12" fill="#81D4FA">Every 4-digit number reaches 6174 in at most 7 steps! Try your own number!</text>
  <!-- Interactive area hint -->
  <rect x="470" y="295" width="110" height="60" fill="#FF6F00" rx="8" opacity="0.9"/>
  <text x="525" y="318" text-anchor="middle" font-family="Arial" font-size="12" fill="white" font-weight="bold">Try it!</text>
  <text x="525" y="335" text-anchor="middle" font-family="Arial" font-size="11" fill="#FFF3E0">Enter a number</text>
  <text x="525" y="348" text-anchor="middle" font-family="Arial" font-size="11" fill="#FFF3E0">and watch!</text>
</svg>
