<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Coin Triangle Flip (Demaine Coin Puzzles) -->
  <defs>
    <radialGradient id="coinGold" cx="40%" cy="35%">
      <stop offset="0%" style="stop-color:#FFE082"/>
      <stop offset="50%" style="stop-color:#FFD54F"/>
      <stop offset="100%" style="stop-color:#FFA000"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="#1B5E20" rx="12"/>
  <text x="300" y="32" text-anchor="middle" font-family="Georgia" font-size="20" fill="#FFD700" font-weight="bold">Coin Triangle Flip</text>
  <!-- LEFT: Triangle pointing UP -->
  <text x="150" y="60" text-anchor="middle" font-family="Arial" font-size="14" fill="#A5D6A7">BEFORE</text>
  <!-- Row 1 (top) - 1 coin -->
  <circle cx="150" cy="110" r="25" fill="url(#coinGold)" filter="url(#shadow)" stroke="#E65100" stroke-width="1.5"/>
  <text x="150" y="115" text-anchor="middle" font-family="Arial" font-size="14" fill="#5D4037" font-weight="bold">1</text>
  <!-- Row 2 - 2 coins -->
  <circle cx="120" cy="165" r="25" fill="url(#coinGold)" filter="url(#shadow)" stroke="#E65100" stroke-width="1.5"/>
  <text x="120" y="170" text-anchor="middle" font-family="Arial" font-size="14" fill="#5D4037" font-weight="bold">2</text>
  <circle cx="180" cy="165" r="25" fill="url(#coinGold)" filter="url(#shadow)" stroke="#E65100" stroke-width="1.5"/>
  <text x="180" y="170" text-anchor="middle" font-family="Arial" font-size="14" fill="#5D4037" font-weight="bold">3</text>
  <!-- Row 3 - 3 coins -->
  <circle cx="90" cy="220" r="25" fill="url(#coinGold)" filter="url(#shadow)" stroke="#E65100" stroke-width="1.5"/>
  <text x="90" y="225" text-anchor="middle" font-family="Arial" font-size="14" fill="#5D4037" font-weight="bold">4</text>
  <circle cx="150" cy="220" r="25" fill="url(#coinGold)" filter="url(#shadow)" stroke="#E65100" stroke-width="1.5"/>
  <text x="150" y="225" text-anchor="middle" font-family="Arial" font-size="14" fill="#5D4037" font-weight="bold">5</text>
  <circle cx="210" cy="220" r="25" fill="url(#coinGold)" filter="url(#shadow)" stroke="#E65100" stroke-width="1.5"/>
  <text x="210" y="225" text-anchor="middle" font-family="Arial" font-size="14" fill="#5D4037" font-weight="bold">6</text>
  <!-- Triangle outline (pointing up) -->
  <path d="M150 80 L75 245 L225 245 Z" fill="none" stroke="#A5D6A7" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
  <!-- Arrow -->
  <path d="M260 170 L340 170" stroke="#FFD700" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="300" y="155" text-anchor="middle" font-family="Arial" font-size="12" fill="#FFD700">Move 3</text>
  <text x="300" y="195" text-anchor="middle" font-family="Arial" font-size="12" fill="#FFD700">coins!</text>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FFD700"/>
    </marker>
  </defs>
  <!-- RIGHT: Triangle pointing DOWN -->
  <text x="450" y="60" text-anchor="middle" font-family="Arial" font-size="14" fill="#A5D6A7">AFTER</text>
  <!-- Row 1 (top) - 3 coins -->
  <circle cx="390" cy="110" r="25" fill="url(#coinGold)" filter="url(#shadow)" stroke="#E65100" stroke-width="1.5" opacity="0.4"/>
  <text x="390" y="115" text-anchor="middle" font-family="Arial" font-size="14" fill="#5D4037">?</text>
  <circle cx="450" cy="110" r="25" fill="url(#coinGold)" filter="url(#shadow)" stroke="#E65100" stroke-width="1.5" opacity="0.4"/>
  <text x="450" y="115" text-anchor="middle" font-family="Arial" font-size="14" fill="#5D4037">?</text>
  <circle cx="510" cy="110" r="25" fill="url(#coinGold)" filter="url(#shadow)" stroke="#E65100" stroke-width="1.5" opacity="0.4"/>
  <text x="510" y="115" text-anchor="middle" font-family="Arial" font-size="14" fill="#5D4037">?</text>
  <!-- Row 2 - 2 coins -->
  <circle cx="420" cy="165" r="25" fill="url(#coinGold)" filter="url(#shadow)" stroke="#E65100" stroke-width="1.5" opacity="0.4"/>
  <text x="420" y="170" text-anchor="middle" font-family="Arial" font-size="14" fill="#5D4037">?</text>
  <circle cx="480" cy="165" r="25" fill="url(#coinGold)" filter="url(#shadow)" stroke="#E65100" stroke-width="1.5" opacity="0.4"/>
  <text x="480" y="170" text-anchor="middle" font-family="Arial" font-size="14" fill="#5D4037">?</text>
  <!-- Row 3 - 1 coin -->
  <circle cx="450" cy="220" r="25" fill="url(#coinGold)" filter="url(#shadow)" stroke="#E65100" stroke-width="1.5" opacity="0.4"/>
  <text x="450" y="225" text-anchor="middle" font-family="Arial" font-size="14" fill="#5D4037">?</text>
  <!-- Triangle outline (pointing down) -->
  <path d="M375 85 L525 85 L450 250 Z" fill="none" stroke="#FF5722" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
  <!-- Instructions -->
  <rect x="100" y="270" width="400" height="110" fill="#263238" rx="10" opacity="0.85"/>
  <text x="300" y="298" text-anchor="middle" font-family="Georgia" font-size="16" fill="#FFD700" font-weight="bold">Captain Kiwi's Challenge</text>
  <text x="300" y="320" text-anchor="middle" font-family="Arial" font-size="13" fill="#E0E0E0">6 gold coins form a triangle pointing UP.</text>
  <text x="300" y="340" text-anchor="middle" font-family="Arial" font-size="13" fill="#E0E0E0">Move exactly 3 coins to make it point DOWN.</text>
  <text x="300" y="365" text-anchor="middle" font-family="Arial" font-size="12" fill="#A5D6A7" font-style="italic">Tap and drag the coins!</text>
</svg>