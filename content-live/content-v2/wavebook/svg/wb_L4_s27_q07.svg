  <circle cx="140" cy="73" r="4" fill="#333"/>
  <circle cx="161" cy="73" r="4" fill="#333"/>
  <text x="100" y="140" text-anchor="middle" font-size="10" font-family="Arial" fill="#555">Holes are symmetric about</text>
  <text x="100" y="158" text-anchor="middle" font-size="12" font-family="Arial" font-weight="bold" fill="#E53935">the fold line</text>
