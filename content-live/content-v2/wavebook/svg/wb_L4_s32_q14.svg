  <line x1="30" y1="110.0" x2="270" y2="110.0" stroke="#1A1A2E" stroke-width="1.5"/>
  <circle cx="60" cy="85.0" r="15" fill="#FFC107" stroke="#FF6D00" stroke-width="1.5"/>
