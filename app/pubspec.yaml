name: kiwimath_app
description: Kiwimath — adaptive math learning for Grades 1-6 with characters, hints, and rewards.
publish_to: 'none'
version: 1.4.0+6

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_svg: ^2.0.10+1
  flutter_math_fork: ^0.7.2
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  shared_preferences: ^2.2.3
  path_provider: ^2.1.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_riverpod: ^2.5.1
  flutter_epub_viewer: ^1.2.8  # EPUB reader (book_reader.dart)
  flutter_inappwebview: ^6.1.5  # our fully-owned HTML reader (html_book_reader.dart)
  url_launcher: ^6.3.2  # open external links (e.g. video solutions) outside the reader
  kiwi_reader:
    path: ../kiwireader/packages/kiwi_reader

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
