# Cloud Scheduler job for the Weekly League rollover (promotion / relegation).
# Runs Sunday 23:55 IST = Sunday 18:25 UTC, just before the IST-aligned week ticks
# over to Monday — so it rolls the week that is ending, then fresh cohorts form
# lazily as students return.
#
# Auth: the endpoint authenticates via the X-Internal-Key header, which must match
# the KIWIMATH_INTERNAL_API_KEY env var on the Cloud Run service (the SAME secret
# used by the clan cron). Do NOT commit the secret to git.
#
# Create (replace $KIWIMATH_INTERNAL_API_KEY with the actual secret):
#   gcloud scheduler jobs create http weekly-league-rollover \
#     --schedule="25 18 * * 0" \
#     --uri="https://kiwimath-api-deufqab6gq-el.a.run.app/v3/internal/league-rollover" \
#     --http-method=POST \
#     --headers="X-Internal-Key=$KIWIMATH_INTERNAL_API_KEY" \
#     --location=asia-south1 \
#     --time-zone="UTC" \
#     --description="Weekly league promotion/relegation, Sunday 23:55 IST"
#
# Update an existing job:
#   gcloud scheduler jobs update http weekly-league-rollover \
#     --schedule="25 18 * * 0" \
#     --uri="https://kiwimath-api-deufqab6gq-el.a.run.app/v3/internal/league-rollover" \
#     --update-headers="X-Internal-Key=$KIWIMATH_INTERNAL_API_KEY" \
#     --location=asia-south1

name: weekly-league-rollover
schedule: "25 18 * * 0"
time_zone: UTC
description: "Weekly league promotion/relegation (Sunday 23:55 IST)"
http_target:
  uri: "https://kiwimath-api-deufqab6gq-el.a.run.app/v3/internal/league-rollover"
  http_method: POST
  headers:
    X-Internal-Key: "REPLACE_WITH_KIWIMATH_INTERNAL_API_KEY"
retry_config:
  retry_count: 3
  min_backoff_duration: "30s"
  max_backoff_duration: "300s"
